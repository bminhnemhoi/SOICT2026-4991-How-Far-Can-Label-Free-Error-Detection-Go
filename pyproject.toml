[project]
name = "autocsv-led"
version = "0.11.0"
description = "AutoCSV-LED: Zero-Configuration Selective Error Detection for Tabular Data with Calibrated Language-Model Committees and Conformal Abstention"
requires-python = ">=3.11,<3.13"
authors = [{name = "Ngo Binh Minh", email = "ngobinhminh.st@tdtu.edu.vn"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["tabular error detection", "zero configuration", "Dempster-Shafer", "conformal prediction", "LLM-as-judge"]

dependencies = [
  # Core data
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15.0",          # parquet
  "openml>=0.14",
  "pyyaml>=6.0",
  "jsonschema>=4.21",

  # ML
  "scikit-learn>=1.4",
  "torch>=2.2",
  "pyod>=2.0",              # Isolation Forest, Deep SVDD, AE baselines
  "transformers>=4.40",     # DeBERTa-v3 NLI for consistency
  "sentence-transformers>=2.7",

  # LLM clients
  "openai>=1.30",
  "anthropic>=0.25",
  "tenacity>=8.2",          # retries

  # DS / uncertainty
  "pyds>=1.4",              # Dempster-Shafer
  "scipy>=1.12",

  # Eval / plotting
  "matplotlib>=3.8",
  "seaborn>=0.13",

  # Cache + utils
  "diskcache>=5.6",
  "tqdm>=4.66",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "black>=24.3",
  "mypy>=1.9",
  "ipykernel>=6.29",
  "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
